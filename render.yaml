services:
  - type: web
    name: geniebot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: z-ai/glm-4.6
      - key: OPENROUTER_VISION_MODEL
        value: z-ai/glm-4.6v
      - key: LOG_LEVEL
        value: INFO
